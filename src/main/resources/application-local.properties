# DataBase Integration (postgreSql)
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/InventoryManagementSystem
spring.r2dbc.username=postgres
spring.r2dbc.password=admin

# Liquibase (uses JDBC, not R2DBC — needs separate JDBC url)
spring.liquibase.url=jdbc:postgresql://localhost:5432/InventoryManagementSystem
spring.liquibase.user=postgres
spring.liquibase.password=admin
spring.liquibase.change-log=classpath:db-migration/db-changelog-main.yaml

logging.level.org.springframework.data.r2dbc=DEBUG

# .env file import
spring.config.import=optional:file:.env.local[.properties]

# jwt
jwt.secret=${JWT.SECRET}
jwt.expiration=${JWT.EXPIRATION}

# File upload
app.upload.path=src/main/resources/static/uploads/products
app.upload.max-size-mb=1

# Supabase Storage
supabase.url=not-used
supabase.anon-key=not-used
supabase.storage.bucket=not-used