# ============================================================
# TEST PROFILE — used in CI pipeline (no .env files needed)
# ============================================================

# In-memory H2 R2DBC — no real PostgreSQL needed
spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=

# Disable Liquibase in tests — schema is not needed for unit/slice tests
spring.liquibase.enabled=false

# JWT stubs — any 32+ char string works for HS256
jwt.secret=${JWT_SECRET:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
jwt.expiration=3600000

# Storage — test profile uses no real file system or Supabase
# app.upload.path is NOT needed here because ImageUtil no longer
# has @Value injection; upload path lives in LocalStorageService only.

# Supabase placeholders — SupabaseStorageService is @Profile("dev")
# so it won't start in test, but these silence any stray references
supabase.url=not-used
supabase.anon-key=not-used
supabase.storage.bucket=not-used

# Suppress noisy R2DBC debug logging in test output
logging.level.org.springframework.data.r2dbc=WARN
logging.level.io.r2dbc=WARN