# .env file import
spring.config.import=optional:file:.env.dev[.properties]

# ── R2DBC (reactive) — transaction pooler port 6543 ──────────
spring.r2dbc.url=r2dbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslMode=require&preparedStatementCacheQueries=0
spring.r2dbc.username=${SPRING.R2DBC.USERNAME}
spring.r2dbc.password=${SPRING.R2DBC.PASSWORD}

# ── Liquibase (JDBC) — session pooler port 5432 ──────────────
spring.liquibase.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&user=postgres.klvnzbprkkzfrewsvklb
spring.liquibase.user=${SPRING.LIQUIBASE.USER}
spring.liquibase.password=${SPRING.LIQUIBASE.PASSWORD}
spring.liquibase.change-log=classpath:db-migration/db-changelog-main.yaml

# ── Logging ──────────────────────────────────────────────────
logging.level.org.springframework.data.r2dbc=DEBUG

# jwt
jwt.secret=${jwt.secret}
jwt.expiration=${jwt.expiration}

# File upload
app.upload.path=src/main/resources/static/uploads/products
app.upload.max-size-kb=500

# ── Supabase Storage ──────────────────────────────────────────
supabase.url=${SUPABASE.URL}
supabase.anon-key=${SUPABASE.ANON-KEY}
supabase.storage.bucket=${SUPABASE.STORAGE.BUCKET}
