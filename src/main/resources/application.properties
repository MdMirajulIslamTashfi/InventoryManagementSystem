spring.application.name=InventoryManagementSystem

#spring.profiles.active = local
spring.profiles.active = dev
#spring.profiles.active = dev, content

# Multipart limits (raw upload capped at 5MB per file; a batch of up to ~5 images)
spring.webflux.multipart.max-file-size=5MB
spring.webflux.multipart.max-request-size=30MB

# HEIF/HEIC → JPEG conversion (libheif CLI installed on the host)
app.heif.convert-bin=/usr/bin/heif-convert
