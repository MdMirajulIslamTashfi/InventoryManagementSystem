# ============================================================
# CONTENT PROFILE
# Activates the WebClient adapter that talks to the
# contentmanagementsystem (CMS) microservice for product images.
#
# This profile is additive — it does NOT define its own DB/storage
# config, so it must be run alongside a primary profile:
#   --spring.profiles.active=local,content
#   --spring.profiles.active=dev,content
# ============================================================

# Base URL of the CMS microservice (defaults to its local default port 9090)
cms.base-url=${CMS.BASE.URL:http://localhost:9090}

# WebClient timeouts (ms) for calls to CMS
cms.connect-timeout-ms=5000
cms.response-timeout-ms=15000