name: Inventory Management System — CI/CD Pipeline

# ============================================================
# PROJECT DOCUMENTATION
# ============================================================
# Project      : Inventory Management System
# Author       : Tashfi
# Framework    : Spring Boot 4.0.6 (WebFlux / Reactive)
# Language     : Java 21
# Architecture : Hexagonal (Ports & Adapters)
# Build Tool   : Gradle (Groovy DSL)
#
# ARCHITECTURE OVERVIEW
# ─────────────────────
# Each domain (customer, product) follows hexagonal structure:
#
#   adapter/in/      → HTTP handlers & routers (WebFlux functional)
#   adapter/out/     → R2DBC repositories & persistence adapters
#   application/
#     port/in/       → Use case interfaces + DTOs
#     port/out/      → Persistence port interfaces
#     service/       → Business logic (implements use cases)
#   domain/          → Pure domain models
#
# core/
#   config/          → SecurityConfig, R2dbcConfig, WebConfig
#   security/        → JwtAuthFilter
#   util/            → JwtUtil, ValidationUtil, ImageUtil
#   enums/           → Gender, CreatedBy, ProductStatus
#   exception/       → Domain exceptions + GlobalExceptionHandler
#   storage/         → StorageService, LocalStorageService, SupabaseStorageService
#
# PROFILES
# ────────
# local  → Local PostgreSQL, BCrypt + JwtUtil auth, local file storage
# dev    → Supabase PostgreSQL, Supabase JWT auth, Supabase Storage
#
# THIRD PARTY SERVICES (dev profile)
# ───────────────────────────────────
# Supabase PostgreSQL : Main database via R2DBC (transaction pooler :6543)
#                       Liquibase migrations via JDBC (session pooler :5432)
# Supabase Storage    : Product image uploads with Thumbnailator compression
# Supabase Auth       : JWT signing (Legacy JWT Secret, HS256)
#
# REQUIRED SECRETS (GitHub → Settings → Secrets → Actions)
# ──────────────────────────────────────────────────────────
# SPRING_R2DBC_USERNAME     → Supabase DB username
# SPRING_R2DBC_PASSWORD     → Supabase DB password
# SPRING_LIQUIBASE_USER     → Supabase Liquibase user
# SPRING_LIQUIBASE_PASSWORD → Supabase Liquibase password
# SUPABASE_URL              → https://xxxx.supabase.co
# SUPABASE_ANON_KEY         → Supabase project anon key
# SUPABASE_JWT_SECRET       → Supabase Legacy JWT secret
# SUPABASE_STORAGE_BUCKET   → Storage bucket name
# DOCKER_HUB_USERNAME       → Docker Hub username
# DOCKER_HUB_TOKEN          → Docker Hub access token
# ============================================================

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: inventory_management_system

jobs:
  # JOB 1: BUILD AND TEST
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: STEP 1 - Checkout Source Code
        uses: actions/checkout@v4

      - name: STEP 2 - Document the Build Environment
        run: |
          echo "========================================="
          echo "INVENTORY MANAGEMENT SYSTEM - CI PIPELINE"
          echo "========================================="
          echo ""
          echo " Framework    : Spring Boot 4.0.6 (Web)"
          echo " JAVA         : ${{ env.JAVA_VERSION }}"
          echo " Build tool   : Gradle (Groovy DSL)"
          echo "  Branch     : ${{ github.ref_name }}"
          echo "  Commit     : ${{ github.sha }}"
          echo "  Triggered  : ${{ github.event_name }}"
          echo ""
          echo "  Architecture: Hexagonal (Ports & Adapters)"
          echo "  Domains     : customer, product"
          echo "  Profiles    : local (dev machine), dev (Supabase)"
          echo "=============================================="

      - name: STEP 3 - Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: STEP 4 - Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: STEP 5 - Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: STEP 6 - Document of what build does
        run: |
          echo "============================================="
          echo "              BUILDING THE PROJECT           "
          echo "============================================="
          echo ""
          echo "Running: ./gradlew build -x test"
          echo ""
          echo "This compiles all source files under:"
          echo "    src/main/java/com/tashfi/InvertoryManagementSystem"
          echo ""
          echo "Key dependencies being compiled:"
          echo "    - spring-boot-starter-webflux    (reactive HTTP)"
          echo "    - spring-boot-starter-data-r2dbc (reactive DB)"
          echo "    - spring-boot-starter-security   (JWT auth)"
          echo "    - spring-boot-starter-liquibase  (DB migrations)"
          echo "    - jjwt 0.12.6                    (JWT library)"
          echo "    - thumbnailator                  (image compression)"
          echo "    - lombok                         (boilerplate reduction)"
          echo "----------------------------------------------"

      - name: STEP 7 - Build with gradle
        run: ./gradlew build -x test

      - name: STEP 8 - Document test setup
        run: |
          echo "=============================================="
          echo "                 RUNNING TESTS                "
          echo "=============================================="
          echo "  Test framework : JUnit 5"
          echo "  Extras         : reactor-test, spring-security-test"
          echo "  Running: ./gradlew test"
          echo "----------------------------------------------"

      - name: STEP 9 - Run tests
        run: ./gradlew test

      - name: STEP 10 - upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  # JOB 2: DOCKER BUILD AND PUSH
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: STEP 1 - Checkout Source Code
        uses: actions/checkout@v4

      - name: STEP 2 - Document Docker Setup
        run: |
          echo "==================================="
          echo "         DOCKET IMAGE BUILD        "
          echo "==================================="
          echo ""
          echo " Image name    :  ${{ env.IMAGE_NAME }}"
          echo " Registry      :  Docker Hub "
          echo " Tags          :  latest, ${{ github.sha }}
          echo ""
          echo "  Packages the Spring Boot fat JAR into a"
          echo "  lightweight Eclipse Temurin JRE image."
          echo ""
          echo "  NOTE: Image contains NO secrets."
          echo "  Pass all env vars at container runtime:"
          echo ""
          echo "  docker run -p 8080:8080 \\"
          echo "    -e SPRING_PROFILES_ACTIVE=dev \\"
          echo "    -e SPRING.R2DBC.USERNAME=... \\"
          echo "    -e SPRING.R2DBC.PASSWORD=... \\"
          echo "    -e SUPABASE.URL=... \\"
          echo "    -e SUPABASE.ANON-KEY=... \\"
          echo "    -e SUPABASE.JWT.SECRET=... \\"
          echo "    -e SUPABASE.STORAGE.BUCKET=... \\"
          echo "    ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "=============================================="


      - name: STEP 3 - Download Build Artifact (JAR)
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs/

      - name: STEP 4 - Log in to Docker Hub
        uses: docker/login-activity@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: STEP 5 - Document image tagging strategy
        run: |
          echo "=============================================="
          echo "              IMAGE TAGGING                   "
          echo "=============================================="
          echo "  :latest → always points to latest main build"
          echo "  :sha    → ${{ github.sha }}"
          echo "            pinned tag for rollback if needed"
          echo "----------------------------------------------"

      - name: STEP 6 - Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: STEP 7 - Confirm Push
        run: |
          echo "=============================================="
          echo "         IMAGE PUSHED SUCCESSFULLY            "
          echo "=============================================="
          echo "  Pull command:"
          echo "  docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "----------------------------------------------"
