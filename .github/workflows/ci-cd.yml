name: Inventory Management System — CI/CD Pipeline

# ============================================================
# PROJECT DOCUMENTATION
# ============================================================
# Project      : Inventory Management System
# Author       : Tashfi
# Framework    : Spring Boot 4.0.6 (WebFlux / Reactive)
# Language     : Java 21
# Architecture : Hexagonal (Ports & Adapters)
# Build Tool   : Gradle (Groovy DSL)
#
# PIPELINE STAGES
# ───────────────
# 1. build   → Compile source code (no tests)
# 2. test    → Run JUnit 5 tests with 'test' Spring profile
#              (uses in-memory H2 R2DBC — no real DB needed)
# 3. package → Assemble the fat JAR from cached build outputs
# 4. deploy  → Build & push Docker image to Docker Hub
#              (main branch pushes only)
#
# ARCHITECTURE OVERVIEW
# ─────────────────────
# Each domain (customer, product) follows hexagonal structure:
#
#   adapter/in/      → HTTP handlers & routers (WebFlux functional)
#   adapter/out/     → R2DBC repositories & persistence adapters
#   application/
#     port/in/       → Use case interfaces + DTOs
#     port/out/      → Persistence port interfaces
#     service/       → Business logic (implements use cases)
#   domain/          → Pure domain models
#
# core/
#   config/          → SecurityConfig, R2dbcConfig, WebConfig
#   security/        → JwtAuthFilter
#   util/            → JwtUtil, ValidationUtil, ImageUtil
#   enums/           → Gender, CreatedBy, ProductStatus
#   exception/       → Domain exceptions + GlobalExceptionHandler
#   storage/         → StorageService, LocalStorageService, SupabaseStorageService
#
# PROFILES
# ────────
# local  → Local PostgreSQL, BCrypt + JwtUtil auth, local file storage
# dev    → Supabase PostgreSQL, Supabase JWT auth, Supabase Storage
# test   → In-memory H2 R2DBC, Liquibase disabled, dummy JWT secret
#
# REQUIRED SECRETS (GitHub → Settings → Secrets → Actions)
# ──────────────────────────────────────────────────────────
# DOCKER_HUB_USERNAME       → Docker Hub username
# DOCKER_HUB_TOKEN          → Docker Hub access token
# ============================================================

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: inventory_management_system

# ============================================================
# STAGE 1 — BUILD
# Compiles all source files. Tests are excluded here so that
# compile errors are surfaced fast and separately from test
# failures. Build outputs are cached for downstream jobs.
# ============================================================
jobs:
  build:
    name: "Stage 1 — Build"
    runs-on: ubuntu-latest

    steps:
      - name: STEP 1 - Checkout Source Code
        uses: actions/checkout@v4

      - name: STEP 2 - Print Build Environment Info
        run: |
          echo "========================================="
          echo "INVENTORY MANAGEMENT SYSTEM - CI PIPELINE"
          echo "========================================="
          echo ""
          echo "  Framework    : Spring Boot 4.0.6 (WebFlux / Reactive)"
          echo "  Java         : ${{ env.JAVA_VERSION }}"
          echo "  Build tool   : Gradle (Groovy DSL)"
          echo "  Branch       : ${{ github.ref_name }}"
          echo "  Commit       : ${{ github.sha }}"
          echo "  Triggered by : ${{ github.event_name }}"
          echo ""
          echo "  Architecture : Hexagonal (Ports & Adapters)"
          echo "  Domains      : customer, product"
          echo "  Profiles     : local | dev | test (CI)"
          echo "========================================="

      - name: STEP 3 - Set Up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: STEP 4 - Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: STEP 5 - Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: STEP 6 - Compile Source Code (skip tests)
        run: |
          echo "============================================="
          echo "              STAGE 1 — BUILD                "
          echo "============================================="
          echo "  Running: ./gradlew classes testClasses -x test"
          echo ""
          echo "  Compiles:"
          echo "    src/main/java  → main classes"
          echo "    src/test/java  → test classes (compile-check only)"
          echo ""
          echo "  Key dependencies:"
          echo "    spring-boot-starter-webflux    (reactive HTTP)"
          echo "    spring-boot-starter-data-r2dbc (reactive DB)"
          echo "    spring-boot-starter-security   (JWT auth)"
          echo "    spring-boot-starter-liquibase  (DB migrations)"
          echo "    j jwt 0.12.6                    (JWT library)"
          echo "    thumbnailator                  (image compression)"
          echo "    lombok                         (boilerplate reduction)"
          echo "---------------------------------------------"
          ./gradlew classes testClasses -x test

      - name: STEP 7 - Cache Build Outputs for Downstream Jobs
        uses: actions/cache/save@v4
        with:
          path: build/
          key: build-outputs-${{ github.sha }}

  # ============================================================
  # STAGE 2 — TEST
  # Runs the full JUnit 5 test suite with spring.profiles.active
  # set to 'test'. The 'test' profile uses:
  #   - r2dbc:h2:mem (in-memory, no real PostgreSQL needed)
  #   - spring.liquibase.enabled=false
  #   - dummy JWT secret (resolves all ${...} placeholders)
  # This is why the context previously failed: the 'local' profile
  # expected JWT.SECRET from .env.local, which doesn't exist in CI.
  # ============================================================
  test:
    name: "Stage 2 — Test"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: STEP 1 - Checkout Source Code
        uses: actions/checkout@v4

      - name: STEP 2 - Set Up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: STEP 3 - Restore Gradle Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: STEP 4 - Restore Build Outputs Cache
        uses: actions/cache/restore@v4
        with:
          path: build/
          key: build-outputs-${{ github.sha }}

      - name: STEP 5 - Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: STEP 6 - Print Test Configuration
        run: |
          echo "============================================="
          echo "              STAGE 2 — TEST                 "
          echo "============================================="
          echo "  Test framework  : JUnit 5"
          echo "  Spring profile  : test"
          echo "  DB (test)       : r2dbc:h2:mem (in-memory)"
          echo "  Liquibase       : disabled in test profile"
          echo "  JWT secret      : dummy stub (placeholder resolved)"
          echo ""
          echo "  WHY 'test' PROFILE?"
          echo "  The 'local' profile reads JWT.SECRET from .env.local"
          echo "  which does not exist in CI — causing the"
          echo "  PlaceholderResolutionException you saw in the logs."
          echo "  The 'test' profile provides all values inline."
          echo ""
          echo "  Extras: reactor-test, spring-security-test"
          echo "  Running: ./gradlew test -Dspring.profiles.active=test"
          echo "---------------------------------------------"

      - name: STEP 7 - Run Tests
        run: ./gradlew test -Dspring.profiles.active=test

      - name: STEP 8 - Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test/
          retention-days: 7


  # ============================================================
  # STAGE 4 — PACKAGE
  # Assembles the Spring Boot fat JAR from compiled classes.
  # We skip tests here (already passed in Stage 2) and upload
  # the JAR as an artifact for the deployment stage.
  # ============================================================
  package:
    name: "Stage 4 — Package"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: STEP 1 - Checkout Source Code
        uses: actions/checkout@v4

      - name: STEP 2 - Set Up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: STEP 3 - Restore Gradle Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: STEP 4 - Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: STEP 5 - Print Package Info
        run: |
          echo "============================================="
          echo "              STAGE 3 — PACKAGE              "
          echo "============================================="
          echo "  Running: ./gradlew bootJar -x test"
          echo ""
          echo "  Produces a single self-contained fat JAR:"
          echo "    build/libs/InventoryManagementSystem-*.jar"
          echo ""
          echo "  The JAR bundles all dependencies and is"
          echo "  ready to be copied into the Docker image."
          echo "---------------------------------------------"

      - name: STEP 6 - Assemble Fat JAR
        run: ./gradlew bootJar -x test

      - name: STEP 7 - Verify JAR Was Produced
        run: |
          echo "JAR files produced:"
          ls -lh build/libs/*.jar
          echo ""
          echo "SHA256 checksums:"
          sha256sum build/libs/*.jar

      - name: STEP 8 - Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  # ============================================================
  # STAGE 5 — DEPLOY
  # Builds the Docker image using the fat JAR from Stage 3,
  # then pushes it to Docker Hub with two tags:
  #   :latest   → always points to the newest main build
  #   :<sha>    → immutable tag for rollback
  #
  # Only runs on direct pushes to main (not PRs).
  #
  # Required secrets:
  #   DOCKER_HUB_USERNAME
  #   DOCKER_HUB_TOKEN
  # ============================================================
  deploy:
    name: "Stage 5 — Deploy (Docker Hub)"
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: STEP 1 - Checkout Source Code
        uses: actions/checkout@v4

      - name: STEP 2 - Print Deploy Info
        run: |
          echo "============================================="
          echo "           STAGE 4 — DEPLOY                  "
          echo "============================================="
          echo ""
          echo "  Image name : ${{ env.IMAGE_NAME }}"
          echo "  Registry   : Docker Hub"
          echo "  Tags       : latest, ${{ github.sha }}"
          echo ""
          echo "  Packages the Spring Boot fat JAR into a"
          echo "  lightweight Eclipse Temurin JRE 25 Alpine image."
          echo ""
          echo "  NOTE: The image contains NO secrets."
          echo "  Pass all env vars at container runtime:"
          echo ""
          echo "  docker run -p 8080:8080 \\"
          echo "    -e SPRING_PROFILES_ACTIVE=dev \\"
          echo "    -e SPRING.R2DBC.USERNAME=... \\"
          echo "    -e SPRING.R2DBC.PASSWORD=... \\"
          echo "    -e SUPABASE.URL=... \\"
          echo "    -e SUPABASE.ANON-KEY=... \\"
          echo "    -e SUPABASE.JWT.SECRET=... \\"
          echo "    -e SUPABASE.STORAGE.BUCKET=... \\"
          echo "    ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "============================================="

      - name: STEP 3 - Download JAR Artifact from Package Stage
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs/

      - name: STEP 4 - Verify JAR Is Present
        run: |
          echo "JAR ready for Docker build:"
          ls -lh build/libs/*.jar

      - name: STEP 5 - Log In to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: STEP 6 - Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: STEP 7 - Print Image Tagging Strategy
        run: |
          echo "============================================="
          echo "           IMAGE TAGGING STRATEGY            "
          echo "============================================="
          echo "  :latest → always points to newest main build"
          echo "  :sha    → ${{ github.sha }}"
          echo "            pinned tag; use for rollback"
          echo ""
          echo "  To roll back to a previous build:"
          echo "  docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:<sha>"
          echo "---------------------------------------------"

      - name: STEP 8 - Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: STEP 9 - Confirm Successful Push
        run: |
          echo "============================================="
          echo "         IMAGE PUSHED SUCCESSFULLY           "
          echo "============================================="
          echo "  Pull command:"
          echo "  docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"
          echo "---------------------------------------------"